<title id="title">SSH MCP — 服务器与工具接入</title><desc id="desc">让 AI 操作服务器，也让操作可追溯。 通过 MCP 执行远程命令、处理文件与检查主机， 集中管理服务器、凭据与人员 / Token 审计。 远程命令执行 集中凭据管理 双审计记录</desc>
